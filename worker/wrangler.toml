# Настройки Cloudflare Worker мойки (v6, выкладка из GitHub через Workers Builds). Секретов здесь нет и быть не должно:
# BOT_TOKEN и SIGN_KEY хранятся в Cloudflare (Settings → Variables and Secrets).
name = "mtrassa"
main = "worker.js"
compatibility_date = "2024-09-23"
# переменные, заданные в панели Cloudflare (CHAT_ID, STAGING_CHAT_ID, GAS_URL…), при выкладке не стираются
keep_vars = true

# хранилище moika-dedupe: ID — Cloudflare → Storage & Databases → KV → moika-dedupe
kv_namespaces = [
  { binding = "DEDUPE", id = "203b90dee41147fe8e6bce44d6492a23" }
]

# счётчик номеров и очередь «Telegram + таблица»
[[durable_objects.bindings]]
name = "DESK"
class_name = "TicketDesk"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TicketDesk"]

# v8: куда ведёт ссылка «оставить отзыв» из просьбы после «Решено» (можно заменить прямо здесь, на GitHub)
[vars]
REVIEW_URL = "https://yandex.by/maps/org/avtomoyka/153062315248/reviews/?add-review=true"
# v8.1: адрес Worker для кнопок «📎 Все вложения» и связи с клиентом
PUBLIC_URL = "https://mtrassa.dowtnohot.workers.dev"

[triggers]
crons = ["0 3 * * *"]
